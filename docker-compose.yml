# version: '3.8'

volumes:
  db_storage:
  n8n_storage:
  energy_db_storage:

services:

  # Runs the internal n8n database. See https://github.com/n8n-io/n8n-hosting/tree/main/docker-compose/withPostgres for more information.
  postgres:
    image: postgres:16
    restart: always
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - POSTGRES_NON_ROOT_USER
      - POSTGRES_NON_ROOT_PASSWORD
    ports:
      - "5434:5432" # Allows access to the n8n internal database on the port 5434 of the host. Only use in production if something other than n8n needs to access it (your machine for example!)
    volumes:
      - db_storage:/var/lib/postgresql/data
      - ./init-data.sh:/docker-entrypoint-initdb.d/init-data.sh
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs n8n
  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: always
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_NON_ROOT_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_NON_ROOT_PASSWORD}
      - N8N_EDITOR_BASE_URL=https://${N8N_HOST}
      - N8N_SECURE_COOKIE=false                      # até ativar HTTPS
      - N8N_WEBHOOK_URL=https://${N8N_HOST}
    # ports: with traefik we do not need to expose the port (users should only use the web browser)
    #   - 5678:5678
    links:
      - postgres
    volumes:
      - n8n_storage:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    labels:
    - "traefik.enable=true"
    - "traefik.http.routers.n8n.rule=Host(`${N8N_HOST}`)"
    - "traefik.http.routers.n8n.entrypoints=web"
    - "traefik.http.services.n8n.loadbalancer.server.port=5678"

  # Runs the clients energy info database
  postgres_energy:
    image: postgres:16
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_ENERGY_DB_USER}
      - POSTGRES_PASSWORD=${POSTGRES_ENERGY_DB_PASSWORD}
      - POSTGRES_DB=${POSTGRES_ENERGY_DB_NAME}
    volumes:
      - energy_db_storage:/var/lib/postgresql/data
    ports:
      - "5433:5432" # Allows access to clients energy database on the port 5433 of the host. Only use in production if something other than n8n needs to access it (your machine for example!)
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_ENERGY_DB_USER} -d ${POSTGRES_ENERGY_DB_NAME}']
      interval: 5s
      timeout: 5s
      retries: 10
    
  reverse-proxy:
  # Runs the Traefik reverse proxy -> we need SSL (HTTPs for N8N):
    # The official v3 Traefik docker image
    image: traefik:v3.4
    container_name: aprendendo_traefik

    ports:
      # The HTTP port
      - "80:80" 
      # The Web UI (enabled by --api.insecure=true)
      - "8080:8080" # to see traefik raw data go to http://localhost:8080/api/rawdata

      # The HTTPS port
      # - "443:443" # Uncomment if you want to use https

    volumes:
      # So that Traefik can listen to the Docker events
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config/traefik.yml:/etc/traefik/traefik.yml:ro # read only -> to run you must have the yml file at ./config/

    restart: unless-stopped
    labels:  
      - traefik.enable=true
      # Router for the dashboard -> Never use this on production
      - traefik.http.routers.traefik.rule=Host(`${TRAEFIK_HOST}`)
      - traefik.http.routers.traefik.entrypoints=web
      - traefik.http.routers.traefik.service=api@internal      # aponta p/ dashboard/API internos

    # In case of shared network
    # networks:
    #  - frontend

  # If we have many docker compose files we should use a shared network
  # Ex: docker network create frontend
  # networks:
  #   frontend:
  #     external: true